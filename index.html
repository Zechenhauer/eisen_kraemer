<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eisen Krämer App</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-4 max-w-sm mx-auto bg-gray-900 text-white min-h-screen">
    <h1 class="text-xl font-bold mb-6 text-yellow-500 uppercase tracking-wider text-center">Eisen Krämer</h1>
    
    <div class="space-y-3 mb-8 bg-gray-800 p-4 rounded-2xl border border-gray-700">
        <input type="date" id="datum" class="w-full bg-gray-900 p-3 rounded-xl border border-gray-700">
        <div class="flex gap-2">
            <input type="time" id="beginn" oninput="berechneStunden()" class="w-full bg-gray-900 p-3 rounded-xl border border-gray-700">
            <input type="time" id="ende" oninput="berechneStunden()" class="w-full bg-gray-900 p-3 rounded-xl border border-gray-700">
        </div>
        <div id="stunden-anzeige" class="text-center font-bold text-yellow-500 py-3 text-2xl border-t border-b border-gray-700 my-2">0,0 Std.</div>
        <input type="text" id="kennzeichen" placeholder="Kennzeichen" class="w-full bg-gray-900 p-3 rounded-xl border border-gray-700">
        <input type="number" id="km" placeholder="KM gefahren" class="w-full bg-gray-900 p-3 rounded-xl border border-gray-700">
        <button id="save-btn" onclick="saveData()" class="w-full bg-yellow-500 text-black font-bold p-4 rounded-xl hover:bg-yellow-400 transition-all">Speichern</button>
    </div>

    <h2 class="text-sm font-bold text-gray-500 uppercase mb-3">Historie</h2>
    <select id="monats-filter" onchange="loadEntries()" class="w-full bg-gray-800 p-3 rounded-xl text-white mb-2 border border-gray-700 font-bold"></select>
    <div id="gesamtstunden" class="text-sm text-gray-400 mb-4 px-2">Gesamt: 0 Std.</div>
    <div id="list-container" class="space-y-2"></div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbweqU-5Bb4Vs0O-Pe4j1GBnW6IU6wR0iHi1K69pYkXPK15PTw4XqOZJ8N18pQxbIxdw5Q/exec";
        document.getElementById('datum').valueAsDate = new Date();

        function berechneStunden() {
            const b = document.getElementById('beginn').value;
            const e = document.getElementById('ende').value;
            const anzeige = document.getElementById('stunden-anzeige');
            if (b && e) {
                const diff = (new Date("1970-01-01T" + e + "Z") - new Date("1970-01-01T" + b + "Z")) / 3600000;
                anzeige.innerText = (diff >= 0 ? diff.toFixed(1).replace('.', ',') : "0,0") + " Std.";
            }
        }

        async function loadEntries() {
            let res = await fetch(WEB_APP_URL);
            let data = await res.json();
            
            // Filtere ungültige Zeilen und hole Monate aus dem Text
            const validData = data.filter(r => r.datum && r.datum.length > 5);
            const monate = Array.from(new Set(validData.map(r => r.datum.substring(0, 7)))).sort().reverse();
            
            const filterSelect = document.getElementById("monats-filter");
            const filterWert = filterSelect.value || monate[0];
            
            filterSelect.innerHTML = monate.map(m => `<option value="${m}" ${m === filterWert ? 'selected' : ''}>${m}</option>`).join('');

            const filteredData = validData.filter(r => r.datum.startsWith(filterWert));
            
            const summe = filteredData.reduce((acc, curr) => {
                const std = parseFloat(curr.stunden.replace(',', '.'));
                return acc + (isNaN(std) ? 0 : std);
            }, 0);
            document.getElementById("gesamtstunden").innerText = `Gesamt: ${summe.toFixed(1).replace('.', ',')} Std.`;

            document.getElementById("list-container").innerHTML = filteredData.reverse()
                .map(r => `
                    <div class="bg-gray-800 p-3 rounded-xl flex justify-between items-center text-sm border border-gray-700">
                        <span class="text-gray-400">${r.datum}</span>
                        <span class="font-bold bg-gray-900 px-2 py-1 rounded">${r.kennzeichen}</span>
                        <span class="font-bold">${r.stunden}</span>
                        <span class="text-yellow-500">${r.km} KM</span>
                    </div>`).join('');
        }

        async function saveData() {
            const btn = document.getElementById('save-btn');
            btn.innerText = "Speichere...";
            const data = {
                datum: document.getElementById('datum').value,
                beginn: document.getElementById('beginn').value,
                ende: document.getElementById('ende').value,
                kennzeichen: document.getElementById('kennzeichen').value,
                km: document.getElementById('km').value,
                stunden: document.getElementById('stunden-anzeige').innerText.replace(' Std.', '')
            };
            await fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify(data) });
            btn.innerText = "Speichern";
            loadEntries();
        }
        loadEntries();
    </script>
</body>
</html>
